<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner code-barres</title>
  <meta
    name="description"
    content="Scanner de code-barres simplifie avec zoom x2 et recuperation des infos produit via API."
  >
  <link rel="shortcut icon" href="assets/app-icons/favicon.ico">
  <link rel="apple-touch-icon" href="assets/app-icons/apple-touch-icon.webp">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <noscript>
    <div class="noscript">
      JavaScript est necessaire pour utiliser le scanner.
    </div>
  </noscript>

  <main class="app">
    <header class="app-header">
      <img src="assets/app-icons/icon-medium.png" width="72" height="72" alt="">
      <h1>Scanner code-barres</h1>
      <p>Detection en continu avec zoom x2.</p>
    </header>

    <section class="scanner" aria-label="Zone de scan">
      <div class="capture-shell">
        <video-capture id="videoCapture" auto-play facing-mode="environment" zoom="2"></video-capture>
        <div class="scan-overlay" aria-hidden="true"></div>
      </div>

      <p id="status" class="status" role="status" aria-live="polite">
        Initialisation de la camera...
      </p>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section class="product" aria-label="Resultat produit">
      <h2>Produit detecte</h2>
      <p class="barcode-line">
        Code:
        <strong id="barcodeValue">-</strong>
      </p>

      <article id="productCard" class="product-card" hidden>
        <img id="productImage" alt="Image du produit" hidden>
        <dl id="productDetails" class="product-details"></dl>
      </article>
    </section>
  </main>

  <script src="./js/index.js" type="module"></script>
</body>
</html>
