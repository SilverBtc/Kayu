<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayu Administration</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .admin-actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn-small {
      padding: 0.3rem 0.6rem;
      font-size: 0.85rem;
      border-radius: 6px;
    }
    .btn-danger {
      background-color: var(--error);
    }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
      align-items: center;
    }
    .tab-nav {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <main class="app" style="width: min(900px, 95vw);">
    <header class="app-header">
      <h1>Admin Panel</h1>
      <p>User and business entity (Product) management.</p>
    </header>

    <nav class="app-nav">
      <a href="index.html">Home</a>
      <a href="faq.html">FAQ</a>
      <a href="#" id="logoutBtn">Logout</a>
    </nav>

    <p id="adminError" class="error" hidden></p>
    <p id="adminSuccess" class="status" hidden></p>

    <div class="tab-nav">
      <button class="tab-btn active" data-target="usersTab">Users</button>
      <button class="tab-btn" data-target="productsTab">Entities (Products)</button>
    </div>

    <!-- USERS TAB -->
    <section id="usersTab" class="tab-content active">
      <h2>User List</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
        </tbody>
      </table>
      <div class="pagination">
        <button id="prevUsers" class="btn btn-small" disabled>Previous</button>
        <span id="pageUsers">Page 1</span>
        <button id="nextUsers" class="btn btn-small">Next</button>
      </div>
    </section>

    <!-- PRODUCTS TAB -->
    <section id="productsTab" class="tab-content">
      <h2>Product List (Business Entities)</h2>
      
      <form id="createProductForm" style="display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: flex-end;">
        <div>
          <label for="pBarcode" style="display: block; font-size: 0.8rem; font-weight: 600;">Barcode</label>
          <input type="text" id="pBarcode" required style="padding: 0.4rem; border: 1px solid var(--border); border-radius: 4px;">
        </div>
        <div>
          <label for="pName" style="display: block; font-size: 0.8rem; font-weight: 600;">Name</label>
          <input type="text" id="pName" required style="padding: 0.4rem; border: 1px solid var(--border); border-radius: 4px;">
        </div>
        <div>
          <label for="pBrand" style="display: block; font-size: 0.8rem; font-weight: 600;">Brand</label>
          <input type="text" id="pBrand" style="padding: 0.4rem; border: 1px solid var(--border); border-radius: 4px;">
        </div>
        <button type="submit" class="btn btn-small">Add</button>
      </form>

      <table class="data-table">
        <thead>
          <tr>
            <th>Barcode</th>
            <th>Name</th>
            <th>Brand</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productsTableBody">
          <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
        </tbody>
      </table>
      <div class="pagination">
        <button id="prevProducts" class="btn btn-small" disabled>Previous</button>
        <span id="pageProducts">Page 1</span>
        <button id="nextProducts" class="btn btn-small">Next</button>
      </div>
    </section>
  </main>

  <script src="./js/users.js" type="module"></script>
</body>
</html>
