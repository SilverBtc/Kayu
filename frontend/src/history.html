<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My History</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Scan History</h1>
      <p>Your recently scanned products.</p>
    </header>

    <nav class="app-nav">
      <a href="index.html">Home</a>
      <a href="users.html">Users</a>
      <a href="login.html" id="authLink">Login</a>
    </nav>

    <section>
      <p id="historyError" class="error" hidden></p>
      
      <table class="data-table" id="historyTable" hidden>
        <thead>
          <tr>
            <th>Date</th>
            <th>Barcode</th>
            <th>Product</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <tr>
            <td colspan="3" style="text-align: center;">Loading...</td>
          </tr>
        </tbody>
      </table>

      <div id="loginPrompt" style="text-align: center; margin-top: 2rem;" hidden>
        <p>You must be logged in to view your history.</p>
        <a href="login.html" class="btn" style="text-decoration: none; display: inline-block; margin-top: 1rem;">Log in</a>
      </div>
    </section>
  </main>

  <script src="./js/history.js" type="module"></script>
</body>
</html>
